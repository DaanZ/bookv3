<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Designed for a tablet in portrait, and meant to be added to the homescreen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#04181B" />
    <!-- The mark: the design system's `book` icon in deep ink on an orange tile. Orange
         because it holds against a light tab strip, a dark one and a grey dock alike.
         The SVG is the source of truth; the PNGs are for the surfaces that refuse it. -->
    <link rel="icon" href="%BASE_URL%assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%assets/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%BASE_URL%assets/favicon-180.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>Snippers</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
